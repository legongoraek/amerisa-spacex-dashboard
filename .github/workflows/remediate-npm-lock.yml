name: One-time dependency remediation
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/remediate-npm-lock.yml
permissions:
  contents: write
jobs:
  npm-lock-remediation:
    if: ${{ github.event.pull_request.head.repo.full_name == 'legongoraek/amerisa-spacex-dashboard' && github.event.pull_request.head.ref == 'security/fix-npm-audit-20261026' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-fund
      - name: Apply compatible lockfile security resolutions
        run: |
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          git diff --stat -- package.json package-lock.json
      - name: Commit dependency-only changes to remediation branch
        run: |
          git add package.json package-lock.json
          if git diff --staged --quiet; then
            echo "::notice::No compatible dependency changes generated."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix(deps): resolve compatible npm audit findings"
            git push origin HEAD:refs/heads/security/fix-npm-audit-20261026
          fi
      - name: Report remaining advisories
        run: |
          npm audit --json > audit.json || true
          node -e 'const r=require("./audit.json"); for (const [name,v] of Object.entries(r.vulnerabilities||{})) console.log(JSON.stringify({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,via:v.via.filter(x=>typeof x==="object").map(x=>({title:x.title,url:x.url,range:x.range}))}));'
